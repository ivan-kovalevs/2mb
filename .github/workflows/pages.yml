name: Publish approval site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for artifact metadata
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 12; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId
              });
              if (data.artifacts.some(item => item.name === 'github-pages')) return;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('GitHub Pages artifact metadata is not available yet.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
